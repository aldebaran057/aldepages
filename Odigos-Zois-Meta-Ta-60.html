<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Δείτε τον Οδηγό Ζωής μετά τα 60 ως εικόνες σελίδων ή ανοίξτε το PDF.">
  <title>Οδηγός Ζωής μετά τα 60</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f3f4f6; color: #1f2937; }
    header { position: sticky; top: 0; z-index: 1; padding: 1rem; text-align: center; background: #fff; box-shadow: 0 1px 4px #0002; }
    h1 { margin: 0 0 .5rem; font-size: clamp(1.2rem, 3vw, 1.8rem); }
    a { color: #0759a5; }
    main { max-width: 1000px; margin: 1rem auto; padding: 0 1rem; }
    #status { text-align: center; }
    #pages { display: grid; gap: 1rem; }
    .page { min-height: 300px; display: grid; place-items: center; overflow: hidden; background: white; border: 1px solid #d1d5db; box-shadow: 0 2px 8px #0001; }
    .page canvas { display: block; width: 100%; height: auto; }
    .page-label { padding: .5rem; color: #6b7280; font-size: .9rem; }
    .error { color: #9b1c1c; }
  </style>
</head>
<body>
  <header>
    <h1>Οδηγός Ζωής μετά τα 60</h1>
    <a href="Odigos-Zois-Meta-Ta-60.pdf" target="_blank" rel="noopener">Άνοιγμα ή λήψη του PDF</a>
  </header>
  <main>
    <p id="status" role="status">Φόρτωση σελίδων…</p>
    <section id="pages" aria-label="Οι σελίδες του οδηγού ως εικόνες"></section>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    (async () => {
      const status = document.getElementById('status');
      const pages = document.getElementById('pages');
      if (!window.pdfjsLib) {
        status.textContent = 'Δεν ήταν δυνατή η φόρτωση του προβολέα PDF. Χρησιμοποιήστε τον σύνδεσμο για να ανοίξετε το PDF.';
        status.className = 'error';
        return;
      }
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      try {
        const pdf = await pdfjsLib.getDocument('Odigos-Zois-Meta-Ta-60.pdf').promise;
        status.textContent = `Φόρτωση ${pdf.numPages} σελίδων…`;
        const observer = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            observer.unobserve(entry.target);
            renderPage(pdf, Number(entry.target.dataset.page), entry.target);
          });
        }, { rootMargin: '500px 0px' });
        for (let number = 1; number <= pdf.numPages; number++) {
          const section = document.createElement('article');
          section.className = 'page';
          section.dataset.page = number;
          section.setAttribute('aria-label', `Σελίδα ${number}`);
          const label = document.createElement('span');
          label.className = 'page-label';
          label.textContent = `Σελίδα ${number}`;
          section.appendChild(label);
          pages.appendChild(section);
          observer.observe(section);
        }
        status.textContent = `${pdf.numPages} σελίδες — οι εικόνες φορτώνονται καθώς κάνετε κύλιση.`;
      } catch (error) {
        console.error(error);
        status.textContent = 'Δεν ήταν δυνατή η εμφάνιση των σελίδων. Ανοίξτε ή κατεβάστε το PDF από τον σύνδεσμο παραπάνω.';
        status.className = 'error';
      }
    })();

    async function renderPage(pdf, number, container) {
      try {
        const page = await pdf.getPage(number);
        const base = page.getViewport({ scale: 1 });
        const scale = Math.min((container.clientWidth || 900) / base.width, 2);
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        canvas.setAttribute('role', 'img');
        canvas.setAttribute('aria-label', `Εικόνα σελίδας ${number}`);
        canvas.width = Math.ceil(viewport.width);
        canvas.height = Math.ceil(viewport.height);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        container.replaceChildren(canvas);
      } catch (error) {
        console.error(error);
        container.textContent = `Δεν φορτώθηκε η σελίδα ${number}.`;
      }
    }
  </script>
</body>
</html>
