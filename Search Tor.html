<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()">

<title>🔒 Private Search</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f172a;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:90%;
    max-width:700px;
    text-align:center;
}

.logo{
    font-size:60px;
    margin-bottom:15px;
}

h1{
    margin-bottom:30px;
    color:#f8fafc;
}

.search-box{
    display:flex;
    gap:10px;
    margin-bottom:25px;
}

.search-box input{
    flex:1;
    padding:16px;
    border:none;
    border-radius:12px;
    font-size:18px;
    outline:none;
}

.search-box button{
    padding:16px 24px;
    border:none;
    border-radius:12px;
    background:#ff7b00;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.search-box button:hover{
    background:#e56d00;
}

.shortcuts{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:10px;
    margin-top:20px;
}

.shortcuts a{
    background:#1e293b;
    color:white;
    text-decoration:none;
    padding:14px;
    border-radius:10px;
    transition:.2s;
}

.shortcuts a:hover{
    background:#334155;
}

.info{
    margin-top:30px;
    font-size:14px;
    color:#cbd5e1;
}

.footer{
    margin-top:20px;
    color:#94a3b8;
    font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">🔒</div>

<h1>Private Search</h1>

<form action="https://html.duckduckgo.com/html/" method="GET">

<div class="search-box">
<input
type="text"
name="q"
placeholder="Πληκτρολόγησε αναζήτηση..."
autocomplete="off"
autocorrect="off"
autocapitalize="off"
spellcheck="false"
autofocus>

<button type="submit">Αναζήτηση</button>
</div>

</form>

<div class="shortcuts">
<a href="https://duckduckgo.com">DuckDuckGo</a>
<a href="https://search.brave.com">Brave</a>
<a href="https://www.wikipedia.org">Wikipedia</a>
<a href="https://github.com">GitHub</a>
<a href="https://www.reddit.com">Reddit</a>
<a href="https://www.youtube.com">YouTube</a>
<a href="https://news.ycombinator.com">Hacker News</a>
<a href="https://archive.org">Archive</a>
</div>

<div class="info">
✅ Χωρίς JavaScript<br>
✅ Χωρίς trackers<br>
✅ Χωρίς cookies από τη σελίδα<br>
✅ No Referrer<br>
✅ Mobile Friendly
</div>

<div class="footer">
Private Search Hub
</div>

</div>

</body>
</html>
